<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الطلبية</title>
<meta name="theme-color" content="#16834a">
<link rel="icon" href="../caisse/icon-192.png">
<style>
  :root { --bg: #f4f6f9; --card: #ffffff; --text: #17202e; --muted: #677489; --line: #e3e8ef; --brand: #16834a; --brand-soft: #e6f6ec; --warn: #b26a00; --warn-soft: #fff4e0; --bad: #c62828; --bad-soft: #fdecec; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f141b; --card: #18202b; --text: #e8edf4; --muted: #95a1b3; --line: #273243; --brand-soft: #143323; --warn-soft: #3a2b12; --bad-soft: #3a1c1f; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  button, input, textarea { font: inherit; color: inherit; }
  header { background: var(--brand); color: #fff; padding: calc(16px + env(safe-area-inset-top)) 16px 18px; }
  header .hin { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  header h1 { margin: 0; font-size: 20px; flex: 1; min-width: 0; }
  header .sub { font-size: 13px; opacity: .9; margin-top: 2px; }
  .lang { border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff; border-radius: 9px; padding: 6px 10px; font-size: 13px; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 16px calc(30px + env(safe-area-inset-bottom)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .note { background: var(--brand-soft); color: var(--brand); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
  label { display: block; font-size: 14px; font-weight: 700; margin: 12px 0 5px; }
  label small { font-weight: 500; color: var(--muted); }
  .in { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px; font-size: 16px; }
  .in:focus { outline: 2px solid var(--brand); outline-offset: 0; }
  textarea.in { min-height: 170px; line-height: 1.6; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row2 label { margin-top: 0; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .btn { width: 100%; margin-top: 16px; border: 0; border-radius: 14px; padding: 15px; font-weight: 800; font-size: 17px; background: var(--brand); color: #fff; }
  .btn:disabled { opacity: .55; }
  .btn.ghost { background: var(--card); color: var(--text); border: 1px solid var(--line); font-size: 15px; padding: 12px; }
  .err { color: var(--bad); font-size: 14px; margin-top: 10px; min-height: 1em; text-align: center; }
  .hp { position: absolute; top: 0; inset-inline-start: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; clip-path: inset(50%); }
  /* الحالة */
  .steps { list-style: none; margin: 8px 0 0; padding: 0; }
  .steps li { display: flex; align-items: center; gap: 12px; padding: 10px 0; color: var(--muted); }
  .steps .dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 15px; flex: none; }
  .steps li.done { color: var(--text); }
  .steps li.done .dot { background: var(--brand); border-color: var(--brand); color: #fff; }
  .steps li.now { color: var(--text); font-weight: 800; }
  .steps li.now .dot { border-color: var(--brand); color: var(--brand); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--brand-soft); } }
  .big-ok { background: var(--brand-soft); color: var(--brand); border-radius: 14px; padding: 14px; font-size: 17px; font-weight: 800; text-align: center; margin-top: 10px; }
  .big-bad { background: var(--bad-soft); color: var(--bad); border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 700; text-align: center; margin-top: 10px; }
  .mine { white-space: pre-wrap; background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; margin-top: 10px; line-height: 1.55; }
  .muted { color: var(--muted); font-size: 13px; }
  .closed { text-align: center; padding: 30px 10px; }
  .closed .ic { font-size: 46px; }
  .hidden { display: none !important; }
  .me { display: flex; align-items: center; gap: 12px; background: var(--brand-soft); border-radius: 12px; padding: 12px; }
  .me .av { width: 42px; height: 42px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none; }
  .me b { display: block; font-size: 16px; }
  .me span { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<header><div class="hin"><div style="flex:1;min-width:0"><h1 id="shop">…</h1><div class="sub" id="addr"></div></div><button class="lang" id="langBtn"></button></div></header>
<main>
  <div id="loading" class="card closed"><div class="muted">…</div></div>

  <!-- المحل ما كيقبلش الطلبيات / ما كاينش -->
  <div id="closedBox" class="card closed hidden"><div class="ic">🕘</div><p id="closedMsg"></p></div>

  <!-- الاستمارة -->
  <form id="form" class="hidden" autocomplete="on" novalidate>
    <div class="note hidden" id="note" dir="auto"></div>
    <div class="card">
      <!-- الرابط الشخصي: السمية والتيليفون معروفين -->
      <div id="me" class="me hidden"><div class="av" id="meAv"></div><div style="min-width:0"><span data-i="orderFor"></span><b id="meName"></b><span dir="ltr" id="mePhone"></span></div></div>
      <div id="who">
      <div class="row2">
        <div><label for="first"><span data-i="first"></span> *</label><input id="first" class="in" autocomplete="given-name" maxlength="40" required></div>
        <div><label for="last" data-i="last"></label><input id="last" class="in" autocomplete="family-name" maxlength="40"></div>
      </div>
      <label for="phone"><span data-i="phone"></span> * <small data-i="phoneWa"></small></label>
      <input id="phone" class="in" type="tel" inputmode="tel" dir="ltr" autocomplete="tel" maxlength="20" required>
      </div>
      <label for="items"><span data-i="items"></span> *</label>
      <textarea id="items" class="in" maxlength="1500" dir="auto" required></textarea>
      <div class="hint" id="count"></div>
      <input id="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn" id="send" type="submit"></button>
      <div class="err" id="err"></div>
    </div>
  </form>

  <!-- الحالة ديال الطلبية -->
  <div id="statusBox" class="hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><strong data-i="yourOrder"></strong><span class="muted" id="when"></span></div>
      <ul class="steps" id="steps"></ul>
      <div id="final"></div>
      <div class="mine" id="mine" dir="auto"></div>
    </div>
    <button class="btn ghost" id="newBtn" data-i="newOrder"></button>
  </div>
</main>

<script>
// صفحة الطلب: كتقرا سمية المحل وكتصيفط الطلبية لـ Firestore (REST، بلا مكتبة) — الحاسوب ديال المحل كيجيبها
const FS = 'https://firestore.googleapis.com/v1/projects/pos-srm-cloud/databases/(default)/documents/';
const qs = new URLSearchParams(location.search);
const U = qs.get('u') || '', S = qs.get('s') || '', K = (qs.get('k') || '').replace(/[^\w-]/g, '').slice(0, 64);
const BASE = `orders/${encodeURIComponent(U)}/sites/${encodeURIComponent(S)}`;
const T = {
  ar: { first: 'السمية', last: 'النسب', phone: 'رقم التيليفون', phoneWa: '(فيه واتساب)', items: 'شنو خاصك؟',
    itemsPh: 'كتب السلعة والمقادير، مثلاً:\n- 1 كيلو دقيق\n- 2 خناشي ديال الحليب\n- 1 لتر زيت', send: 'صيفط الطلبية', sending: 'كنصيفطو…',
    needAll: 'كتب السمية، رقم التيليفون، وشنو خاصك', badPhone: 'رقم التيليفون ماشي صحيح', tooFast: 'تسنّى شوية قبل ما تصيفط طلبية أخرى',
    fail: 'ما تصيفطاتش الطلبية. تأكد من الأنترنت وعاود.', closed: 'المحل ما كيقبلش الطلبيات دابا. عاود من بعد 🙏', notFound: 'هاد الرابط ماشي صحيح.',
    knownOnly: 'الطلب عن بعد غير لزبناء المحل اللي عندهم رابط شخصي. طلب الرابط ديالك من المحل 🙏', badLink: 'هاد الرابط توقف ولا ماشي صحيح. طلب رابط جديد من المحل.', orderFor: 'الطلبية باسم',
    yourOrder: 'الطلبية ديالك', newOrder: 'طلبية جديدة', chars: '{n} / 1500',
    st: { sent: 'تصيفطات', received: 'وصلات للمحل', preparing: 'كيوجّدوها', ready: 'واجدة: جي خودها' },
    readyMsg: '✅ الطلبية ديالك واجدة! تقدر تجي تاخدها.', amount: 'المبلغ: {a}', doneMsg: '👍 تسلّمتي الطلبية. شكراً!', cancelledMsg: 'تلغات الطلبية. عيّط للمحل إلا بغيتي.', lang: 'FR' },
  fr: { first: 'Prénom', last: 'Nom', phone: 'Téléphone', phoneWa: '(avec WhatsApp)', items: 'De quoi avez-vous besoin ?',
    itemsPh: 'Écrivez les produits et les quantités, par ex. :\n- 1 kg de farine\n- 2 sachets de lait\n- 1 L d’huile', send: 'Envoyer la commande', sending: 'Envoi…',
    needAll: 'Saisissez votre prénom, votre téléphone et votre commande', badPhone: 'Numéro de téléphone invalide', tooFast: 'Patientez un peu avant une nouvelle commande',
    fail: "La commande n'est pas partie. Vérifiez Internet et réessayez.", closed: "Le magasin n'accepte pas de commandes pour le moment. Réessayez plus tard 🙏", notFound: "Ce lien n'est pas valide.",
    knownOnly: 'Les commandes à distance sont réservées aux clients du magasin qui ont un lien personnel. Demandez le vôtre au magasin 🙏', badLink: "Ce lien a été désactivé ou n'est pas valide. Demandez un nouveau lien au magasin.", orderFor: 'Commande au nom de',
    yourOrder: 'Votre commande', newOrder: 'Nouvelle commande', chars: '{n} / 1500',
    st: { sent: 'Envoyée', received: 'Reçue par le magasin', preparing: 'En préparation', ready: 'Prête : venez la récupérer' },
    readyMsg: '✅ Votre commande est prête ! Vous pouvez venir la récupérer.', amount: 'Montant : {a}', doneMsg: '👍 Commande récupérée. Merci !', cancelledMsg: 'Commande annulée. Appelez le magasin si besoin.', lang: 'ع' },
};
let lang = (() => { try { return localStorage.getItem('lang') || ((navigator.language || '').startsWith('fr') ? 'fr' : 'ar'); } catch { return 'ar'; } })();
if (!T[lang]) lang = 'ar';
const tr = (k, v = {}) => String(k.split('.').reduce((o, x) => o?.[x], T[lang]) ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const $ = (id) => document.getElementById(id);
const show = (id) => ['loading', 'closedBox', 'form', 'statusBox'].forEach((x) => $(x).classList.toggle('hidden', x !== id));

const dec = (v) => !v ? null : 'stringValue' in v ? v.stringValue : 'booleanValue' in v ? v.booleanValue : 'integerValue' in v ? Number(v.integerValue) : 'doubleValue' in v ? v.doubleValue : 'timestampValue' in v ? v.timestampValue : null;
async function getDoc(path) {
  const r = await fetch(FS + path);
  if (r.status === 404 || r.status === 403) return null;
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  return Object.fromEntries(Object.entries(j.fields || {}).map(([k, x]) => [k, dec(x)]));
}

let meta = null, poll = null, who = null, closedWhy = '';
const myKey = `order:${U}:${S}${K ? ':' + K : ''}`;
const mine = () => { try { return JSON.parse(localStorage.getItem(myKey) || 'null'); } catch { return null; } };

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i]').forEach((el) => (el.textContent = tr(el.dataset.i)));
  $('langBtn').textContent = tr('lang');
  $('items').placeholder = tr('itemsPh');
  $('send').textContent = tr('send');
  $('closedMsg').textContent = tr(closedWhy || (meta ? 'closed' : 'notFound'));
  if (!$('statusBox').classList.contains('hidden')) renderStatus(lastSeen);
}
$('langBtn').onclick = () => { lang = lang === 'ar' ? 'fr' : 'ar'; try { localStorage.setItem('lang', lang); } catch {} applyLang(); };

// ------------------------------------------------------------ الحالة ديال الطلبية
let lastSeen = null;
function renderStatus(o) {
  lastSeen = o;
  const m = mine();
  if (!m) return;
  const order = ['sent', 'received', 'preparing', 'ready'];
  const st = o?.status === 'new' || !o ? 'sent' : o.status;
  const idx = st === 'done' ? 4 : order.indexOf(st);
  $('steps').innerHTML = st === 'cancelled' ? '' : order.map((k, i) => `<li class="${i < idx || (i === idx && k === 'ready') || idx === 4 ? 'done' : i === idx ? 'now' : ''}"><span class="dot">${i < idx || (k === 'ready' && idx >= 3) ? '✓' : i + 1}</span>${tr('st.' + k)}</li>`).join('');
  $('final').innerHTML = st === 'ready' ? `<div class="big-ok">${tr('readyMsg')}${o?.amount != null ? '<br>' + tr('amount', { a: '<bdi dir="ltr">' + Number(o.amount).toLocaleString('fr-MA', { minimumFractionDigits: 2 }) + ' DH</bdi>' }) : ''}</div>`
    : st === 'done' ? `<div class="big-ok">${tr('doneMsg')}</div>` : st === 'cancelled' ? `<div class="big-bad">${tr('cancelledMsg')}</div>` : '';
  $('mine').textContent = m.items;
  $('when').textContent = new Date(m.at).toLocaleString(lang === 'ar' ? 'ar-MA' : 'fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  // كنعاودو نشوفو كل 20 ثانية حتى تكون واجدة (ولا 3 ساعات)
  clearTimeout(poll);
  if (!['ready', 'done', 'cancelled'].includes(st) && Date.now() - m.at < 3 * 3600_000) poll = setTimeout(checkStatus, 20_000);
}
async function checkStatus() {
  const m = mine();
  if (!m) return;
  try { renderStatus(await getDoc(`${BASE}/list/${encodeURIComponent(m.id)}`)); } catch { poll = setTimeout(checkStatus, 30_000); }
}

// ------------------------------------------------------------ الإرسال
$('items').addEventListener('input', () => ($('count').textContent = tr('chars', { n: $('items').value.length })));
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('err').textContent = '';
  if ($('website').value) return; // روبو
  const first = who ? who.first : $('first').value.trim(), last = who ? who.last || '' : $('last').value.trim(), phone = who ? who.phone : $('phone').value.replace(/[^\d+]/g, ''), items = $('items').value.trim();
  if (!first || !phone || !items) return void ($('err').textContent = tr('needAll'));
  if (phone.replace(/\D/g, '').length < 9) return void ($('err').textContent = tr('badPhone'));
  const prev = mine();
  if (prev && Date.now() - prev.at < 60_000) return void ($('err').textContent = tr('tooFast'));
  $('send').disabled = true;
  $('send').textContent = tr('sending');
  try {
    const now = new Date();
    const body = { fields: { first: { stringValue: first.slice(0, 40) }, last: { stringValue: last.slice(0, 40) }, phone: { stringValue: phone.slice(0, 20) }, items: { stringValue: items.slice(0, 1500) }, status: { stringValue: 'new' }, createdAt: { timestampValue: now.toISOString() }, ...(who ? { key: { stringValue: K } } : {}) } };
    const r = await fetch(`${FS}${BASE}/list`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const id = (await r.json()).name.split('/').pop();
    try {
      localStorage.setItem(myKey, JSON.stringify({ id, at: now.getTime(), items }));
      if (!who) localStorage.setItem('customer', JSON.stringify({ first, last, phone }));
    } catch {}
    $('items').value = '';
    show('statusBox');
    renderStatus({ status: 'new' });
  } catch {
    // المحل تسدّ فهاد اللحظة (القاعدة كترفض) ولا ما كاينش الأنترنت
    $('err').textContent = navigator.onLine ? tr(who ? 'badLink' : meta?.known ? 'knownOnly' : 'closed') : tr('fail');
  } finally {
    $('send').disabled = false;
    $('send').textContent = tr('send');
  }
});
$('newBtn').onclick = () => { clearTimeout(poll); show('form'); };

// ------------------------------------------------------------ البداية
(async () => {
  applyLang();
  try { const c = JSON.parse(localStorage.getItem('customer') || '{}'); $('first').value = c.first || ''; $('last').value = c.last || ''; $('phone').value = c.phone || ''; } catch {}
  if (!U || !S) return show('closedBox');
  try { meta = await getDoc(BASE); } catch { meta = null; }
  // الرابط الشخصي: الزبون معروف عند المحل (السمية والتيليفون ما كيتكتبوش)
  if (K) { try { who = await getDoc(`${BASE}/keys/${encodeURIComponent(K)}`); } catch { who = null; } }
  if (who) {
    $('who').classList.add('hidden');
    $('me').classList.remove('hidden');
    $('meName').textContent = `${who.first || ''} ${who.last || ''}`.trim();
    $('mePhone').textContent = who.phone || '';
    $('meAv').textContent = (who.first || '?').trim().charAt(0).toUpperCase();
  }
  $('shop').textContent = meta?.name || '…';
  $('addr').textContent = meta?.address || '';
  document.title = meta?.name || document.title;
  $('note').textContent = meta?.note || '';
  $('note').classList.toggle('hidden', !meta?.note);
  applyLang();
  const m = mine();
  // طلبية ديال اليوم مازال ما تسلّماتش: كنبيّنو الحالة ديالها
  if (m && Date.now() - m.at < 24 * 3600_000) {
    show('statusBox');
    renderStatus(null);
    checkStatus();
    return;
  }
  if (!meta || !meta.open) return show('closedBox');
  if (K && !who) { closedWhy = 'badLink'; applyLang(); return show('closedBox'); }
  if (meta.known && !who) { closedWhy = 'knownOnly'; applyLang(); return show('closedBox'); }
  show('form');
})();
</script>
</body>
</html>
