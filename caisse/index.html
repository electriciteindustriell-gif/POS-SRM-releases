<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة الصندوق</title>
<meta name="theme-color" content="#c62828">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #17202e; --muted: #677489; --line: #e3e8ef;
    --brand: #c62828; --brand-soft: #fdecec; --ok: #16834a; --ok-soft: #e6f6ec; --warn: #b26a00; --warn-soft: #fff4e0; --bad: #c62828;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f141b; --card: #18202b; --text: #e8edf4; --muted: #95a1b3; --line: #273243; --brand-soft: #3a1c1f; --ok-soft: #143323; --warn-soft: #3a2b12; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { padding: env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; }
  header img { width: 36px; height: 36px; border-radius: 9px; }
  header .t { flex: 1; min-width: 0; }
  header h1 { font-size: 18px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: ltr; text-align: start; }
  button { font: inherit; cursor: pointer; }
  .icon-btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 7px 9px; font-size: 13px; }
  .status { display: flex; align-items: center; gap: 8px; border-radius: 12px; padding: 9px 12px; font-size: 13.5px; margin-bottom: 10px; }
  .status.ok { background: var(--ok-soft); color: var(--ok); }
  .status.warn { background: var(--warn-soft); color: var(--warn); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }
  .sync { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 12px; padding: 11px; font-weight: 700; font-size: 15px; margin-bottom: 12px; }
  .sync:disabled { opacity: .7; }
  .sync svg { width: 18px; height: 18px; }
  .sync.busy svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sync-msg { text-align: center; font-size: 13px; color: var(--muted); margin: -6px 0 12px; min-height: 1em; }
  .hero { background: var(--brand); color: #fff; border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .hero .lbl { font-size: 13px; opacity: .85; }
  .hero .big { font-size: 34px; font-weight: 800; letter-spacing: .3px; margin: 2px 0 8px; direction: ltr; text-align: right; }
  .hero .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { background: rgba(255,255,255,.16); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; min-width: 0; }
  .kpi .lbl { font-size: 12.5px; color: var(--muted); }
  .kpi .val { font-size: 20px; font-weight: 750; margin-top: 2px; direction: ltr; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi.neg .val { color: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 15px; margin: 0 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card h2 small { font-weight: 700; color: var(--bad); font-size: 14px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .list li:first-child { border-top: 0; }
  .list .main { flex: 1; min-width: 0; }
  .list .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list .meta { font-size: 12px; color: var(--muted); }
  .list .amt { font-weight: 700; direction: ltr; white-space: nowrap; }
  .list a { color: inherit; text-decoration: none; }
  .badge { font-size: 11.5px; border-radius: 6px; padding: 2px 6px; background: var(--bg); color: var(--muted); white-space: nowrap; }
  .badge.bad { background: var(--brand-soft); color: var(--bad); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .reg { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
  .reg .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
  .reg .cash { font-size: 22px; font-weight: 800; direction: ltr; text-align: right; margin: 4px 0; }
  .reg .meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .empty { color: var(--muted); font-size: 13.5px; padding: 6px 0; }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  /* login */
  .login { max-width: 400px; margin: 8vh auto 0; }
  .login .card { padding: 20px; }
  .login h1 { font-size: 21px; margin: 12px 0 4px; text-align: center; }
  .login p { color: var(--muted); font-size: 14px; text-align: center; margin: 0 0 16px; }
  .login .logo { display: block; width: 64px; height: 64px; margin: 0 auto; border-radius: 16px; }
  label { display: block; font-size: 13.5px; font-weight: 650; margin: 10px 0 5px; }
  input { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); direction: ltr; }
  input:focus { outline: 2px solid var(--brand); outline-offset: 0; }
  .btn { width: 100%; border: 0; background: var(--brand); color: #fff; font-weight: 750; font-size: 16px; padding: 12px; border-radius: 10px; margin-top: 16px; }
  .btn:disabled { opacity: .6; }
  .link { display: block; width: 100%; background: none; border: 0; color: var(--brand); margin-top: 12px; font-size: 14px; }
  .msg { font-size: 13.5px; margin-top: 10px; text-align: center; min-height: 1em; }
  .msg.err { color: var(--bad); } .msg.ok { color: var(--ok); }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
  .hidden { display: none !important; }
  /* القائمة */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--card); color: var(--text); width: 100%; max-width: 640px; border-radius: 18px 18px 0 0; padding: 10px 16px calc(16px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 30px rgba(0,0,0,.25); animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(30px); opacity: .5; } }
  .sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 2px auto 10px; }
  .sheet-title { font-weight: 800; font-size: 16px; margin: 2px 0 8px; }
  .sheet button.row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 6px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--text); font-size: 15px; text-align: start; }
  .sheet button.row:first-of-type { border-top: 0; }
  .sheet button.row .ic { width: 26px; text-align: center; font-size: 18px; }
  .sheet button.row .lb { flex: 1; }
  .sheet button.row .vl { color: var(--muted); font-size: 13px; }
  .sheet button.row.danger { color: var(--bad); }
  .sheet .close { width: 100%; margin-top: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 12px; padding: 11px; font-weight: 700; }
  .sheet p { color: var(--muted); font-size: 14px; margin: 0 0 12px; line-height: 1.6; }
  .sheet .btns { display: flex; gap: 10px; }
  .sheet .btns button { flex: 1; border-radius: 12px; padding: 12px; font-weight: 700; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .sheet .btns button.go { background: var(--brand); border-color: var(--brand); color: #fff; }
  .sheet-msg { font-size: 13px; color: var(--ok); text-align: center; min-height: 1em; margin-top: 6px; }
  .sw { width: 42px; height: 24px; border-radius: 24px; background: var(--line); position: relative; flex: none; transition: background .15s; }
  .sw::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: inset-inline-start .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .sw.on { background: var(--ok); }
  .sw.on::after { inset-inline-start: 21px; }
  /* إخفاء الأرقام (ملي كتوري التيليفون لشي واحد) */
  body.masked .big, body.masked .val, body.masked .cash, body.masked .amt, body.masked .pill bdi, body.masked #debtTotal, body.masked .reg .meta bdi, body.masked .list .name bdi, body.masked .badge bdi { filter: blur(8px); }
  .search { width: 100%; margin: 2px 0 6px; font-size: 15px; padding: 9px 12px; direction: inherit; }
  .stale-copy { font-size: 12px; color: var(--muted); text-align: center; margin: -4px 0 10px; }
  /* المحلات + التبويبات */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 7px 13px; font-size: 13.5px; font-weight: 650; }
  .chips button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .tabs { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 12px; }
  .tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); border-radius: 9px; padding: 8px; font-weight: 650; font-size: 14px; }
  .tabs button.on { background: var(--brand); color: #fff; }
  .muted { color: var(--muted) !important; font-weight: 500 !important; font-size: 12.5px !important; }
  .site-row { cursor: pointer; }
  .site-row .dotc { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ok); }
  .site-row .dotc.warn { background: var(--warn); }
  /* المنحنيات */
  .chart { width: 100%; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart .bar { fill: var(--brand); opacity: .85; }
  .chart .bar.today { opacity: 1; fill: var(--ok); }
  .chart .axis { stroke: var(--line); }
  .chart text { fill: var(--muted); font-size: 9px; font-family: inherit; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .stats div { background: var(--bg); border-radius: 10px; padding: 8px; text-align: center; min-width: 0; }
  .stats b { display: block; font-size: 12.5px; direction: ltr; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats span { font-size: 11.5px; color: var(--muted); }
  .cmp { font-size: 12px; font-weight: 700; direction: ltr; unicode-bidi: isolate; }
  .cmp.up { color: var(--ok); } .cmp.down { color: var(--bad); }
  .yhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ybig { font-size: 26px; font-weight: 800; direction: ltr; text-align: start; margin: 2px 0 6px; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13.5px; margin-top: 6px; }
  .kv span:nth-child(even) { direction: ltr; font-weight: 650; text-align: left; }
  .share-btn { width: 100%; margin-top: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 10px; padding: 10px; font-weight: 700; }
  body.masked .ybig, body.masked .kv span:nth-child(even), body.masked .stats b, body.masked .chart text.v, body.masked .site-row .amt { filter: blur(8px); }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">

  <!-- تسجيل الدخول -->
  <section id="login" class="login hidden">
    <div class="card">
      <img class="logo" src="icon-192.png" alt="">
      <h1 data-i="appName"></h1>
      <p data-i="loginHint"></p>
      <form id="loginForm" autocomplete="on">
        <label for="email" data-i="email"></label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password" data-i="password"></label>
        <input id="password" type="password" autocomplete="current-password" required minlength="6">
        <button class="btn" id="loginBtn" type="submit" data-i="login"></button>
      </form>
      <button class="link" id="forgotBtn" type="button" data-i="forgot"></button>
      <div class="msg" id="loginMsg"></div>
    </div>
    <div class="foot"><button class="icon-btn" data-lang-toggle></button></div>
  </section>

  <!-- لوحة المتابعة -->
  <section id="app" class="hidden">
    <header>
      <img src="icon-192.png" alt="">
      <div class="t"><h1 id="shopName">…</h1><div class="sub" id="userEmail"></div></div>
      <button class="icon-btn" id="menuBtn" aria-label="menu" style="font-size:18px;line-height:1;padding:7px 11px">☰</button>
    </header>
    <div id="status" class="status warn"><span class="dot"></span><span id="statusText"></span></div>
    <button class="sync" id="syncBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"/><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/></svg>
      <span data-i="sync"></span>
    </button>
    <div class="sync-msg" id="syncMsg"></div>
    <div class="stale-copy hidden" id="copyNote"></div>
    <div class="chips hidden" id="siteBar"></div>
    <div class="tabs">
      <button class="on" data-tab="today" data-i="tabToday"></button>
      <button data-tab="reports" data-i="tabReports"></button>
    </div>

    <!-- التقارير: تقرير البارح + 30 يوم + 12 شهر (من وثيقة كل شهر: قراءة وحدة للشهر) -->
    <div id="reportsBox" class="hidden">
      <div class="card" id="yCard"></div>
      <div class="card">
        <h2><span data-i="last30"></span><small class="muted" id="sum30"></small></h2>
        <div id="chart30" class="chart"></div>
        <div class="stats" id="stats30"></div>
      </div>
      <div class="card">
        <h2><span data-i="last12"></span></h2>
        <div id="chart12" class="chart"></div>
        <ul class="list" id="list12"></ul>
      </div>
      <div class="stale-copy" id="repNote"></div>
    </div>

    <div id="noData" class="card empty hidden"></div>
    <div id="todayBox" class="hidden">
      <div class="hero">
        <div class="lbl"><span data-i="salesToday"></span> <span id="kDate"></span></div>
        <div class="big" id="kTotal">0</div>
        <div class="row">
          <span class="pill" id="kCount"></span>
          <span class="pill" id="kDrawer"></span>
        </div>
      </div>
      <div class="grid">
        <div class="kpi"><div class="lbl" data-i="cash"></div><div class="val" id="kCash"></div></div>
        <div class="kpi"><div class="lbl" data-i="card"></div><div class="val" id="kCard"></div></div>
        <div class="kpi"><div class="lbl" data-i="credit"></div><div class="val" id="kCredit"></div></div>
        <div class="kpi"><div class="lbl" data-i="returns"></div><div class="val" id="kReturns"></div></div>
        <div class="kpi"><div class="lbl" data-i="expenses"></div><div class="val" id="kExpenses"></div></div>
        <div class="kpi" id="kProfitBox"><div class="lbl" data-i="profit"></div><div class="val" id="kProfit"></div></div>
      </div>

      <div class="card hidden" id="sitesCard"><h2><span data-i="shopsTitle"></span></h2><ul class="list" id="sitesList"></ul></div>
      <div class="card"><h2><span data-i="openRegisters"></span></h2><div id="regs"></div></div>
      <div class="card"><h2><span data-i="closedToday"></span></h2><ul class="list" id="closed"></ul></div>
      <div class="card"><h2><span data-i="debts"></span><small id="debtTotal"></small></h2><input id="debtSearch" class="search hidden" type="search" autocomplete="off"><ul class="list" id="debts"></ul><div class="note" id="debtNote"></div></div>
    </div>

    <div class="foot" id="foot"></div>
  </section>

  <div id="boot" class="loading">…</div>

  <!-- القائمة -->
  <div id="sheet" class="overlay hidden">
    <div class="sheet" role="dialog">
      <div class="grab"></div>
      <div class="sheet-title" data-i="menu"></div>
      <button class="row" data-act="lang"><span class="ic">🌐</span><span class="lb" data-i="language"></span><span class="vl" id="langVal"></span></button>
      <button class="row" data-act="mask"><span class="ic">👁</span><span class="lb" data-i="hideAmounts"></span><span class="sw" id="maskSw"></span></button>
      <button class="row" data-act="share"><span class="ic">📤</span><span class="lb" data-i="share"></span></button>
      <button class="row" data-act="clear"><span class="ic">🧹</span><span class="lb" data-i="clearArchive"></span><span class="vl" id="storageVal"></span></button>
      <button class="row danger" data-act="logout"><span class="ic">⎋</span><span class="lb" data-i="logout"></span></button>
      <div class="sheet-msg" id="sheetMsg"></div>
      <button class="close" data-act="close" data-i="close"></button>
    </div>
  </div>
  <!-- تأكيد مسح الأرشيف -->
  <div id="confirm" class="overlay hidden">
    <div class="sheet" role="dialog">
      <div class="grab"></div>
      <div class="sheet-title" data-i="clearTitle"></div>
      <p data-i="clearText"></p>
      <div class="btns"><button id="confirmNo" data-i="cancel"></button><button id="confirmYes" class="go" data-i="clearArchive"></button></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, sendPasswordResetEmail, signOut, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, onSnapshot, setDoc, serverTimestamp, collection, getDocs, getDoc, writeBatch } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// هاد القيم ماشي سرية: الحماية كتجي من القواعد ديال Firestore (كل حساب كيشوف غير المحل ديالو)
const app = initializeApp({
  apiKey: 'AIzaSyCLmemsSvhDdvtgKEMgFe9Da_BzNroyReI',
  authDomain: 'pos-srm-cloud.firebaseapp.com',
  projectId: 'pos-srm-cloud',
  storageBucket: 'pos-srm-cloud.firebasestorage.app',
  messagingSenderId: '197776651772',
  appId: '1:197776651772:web:9ea16d94da6f19b8686e79',
});
const auth = getAuth(app);
const db = getFirestore(app);

// ------------------------------------------------------------ اللغة
const T = {
  ar: {
    appName: 'متابعة الصندوق', loginHint: 'دخل بالإيميل وكلمة السر اللي فعّلتي بيهم المتابعة فالبرنامج', email: 'الإيميل', password: 'كلمة السر',
    login: 'دخول', forgot: 'نسيت كلمة السر؟', logout: 'خروج', sync: 'مزامنة',
    noData: 'مازال ما وصلات حتى معلومة من الحاسوب. تأكد بلي المتابعة مفعّلة فالبرنامج (الإعدادات ← المتابعة عن بعد) وبلي الحاسوب فيه الأنترنت.',
    salesToday: 'مبيعات اليوم', cash: 'كاش', card: 'كارط', credit: 'كريدي', returns: 'المرجوعات', expenses: 'المصاريف', profit: 'الربح',
    openRegisters: 'الصناديق المفتوحة', closedToday: 'الصناديق المسدودة اليوم', debts: 'الزبناء اللي عليهم الكريدي',
    sales: 'بيعة', drawer: 'فالصناديق', noOpen: 'حتى صندوق ما مفتوح دابا', noClosed: 'حتى صندوق ما تسدّ اليوم', noDebts: 'حتى زبون ما عليه كريدي 👍',
    expected: 'خاص يكون فالصندوق', openedAt: 'تحلّ', closedAt: 'تسدّ', opening: 'البداية', counted: 'لقا', diff: 'الفرق', exact: 'مضبوط', late: 'فات الأجل',
    moreDebts: '+ {n} زبون آخر', debtCount: '{n} زبون',

let lang = (() => {
  try {
    const saved = localStorage.getItem('lang');
    if (saved) return saved;
  } catch {}
  return (navigator.language || '').startsWith('fr') ? 'fr' : 'ar';
})();
if (!T[lang]) lang = 'ar';
const tr = (k, vars = {}) => String(k.split('.').reduce((o, x) => o?.[x], T[lang]) ?? k).replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? '');
function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = tr('appName');
  document.querySelectorAll('[data-i]').forEach((el) => (el.textContent = tr(el.dataset.i)));
  document.querySelectorAll('[data-lang-toggle]').forEach((el) => (el.textContent = tr('langBtn')));
  $('langVal').textContent = tr('langName');
  $('debtSearch').placeholder = tr('searchDebt');
  render();
}
function switchLang() {
  lang = lang === 'ar' ? 'fr' : 'ar';
  try { localStorage.setItem('lang', lang); } catch {}
  applyLang();
}
document.querySelectorAll('[data-lang-toggle]').forEach((el) => el.addEventListener('click', switchLang));

// ------------------------------------------------------------ أدوات
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let currency = 'MAD';
const money = (n) => (Number(n) || 0).toLocaleString('fr-MA', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ' + (currency === 'MAD' ? 'DH' : currency);
const mh = (n) => `<bdi dir="ltr">${money(n)}</bdi>`;
const toDate = (v) => (v?.toDate ? v.toDate() : v ? new Date(v) : null);
const timeOf = (v) => { const d = toDate(v); return d ? d.toLocaleTimeString(lang === 'ar' ? 'ar-MA' : 'fr-MA', { hour: '2-digit', minute: '2-digit' }) : ''; };
const shortDate = (v) => { const d = toDate(v); return d ? d.toLocaleDateString(lang === 'ar' ? 'ar-MA' : 'fr-FR', { day: 'numeric', month: 'short' }) : ''; };
function ago(d) {
  const m = Math.floor((Date.now() - d.getTime()) / 60000);
  if (m < 1) return tr('now');
  if (m < 60) return tr('minAgo', { n: m });
  if (m < 48 * 60) return tr('hAgo', { n: Math.floor(m / 60) });
  return tr('dAgo', { n: Math.floor(m / 1440) });
}
const dayLabel = (key) => new Date(key + 'T12:00:00').toLocaleDateString(lang === 'ar' ? 'ar-MA' : 'fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const localDayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

// ------------------------------------------------------------ الحالة
// المحلات: كل حاسوب كيكتب shops/{uid}/sites/{site}. الوثيقة القديمة shops/{uid} (نسخ 1.3) كتبان حتى هي
let sites = {}; // site → data
let legacy = null;
let shop = null; // اللي كيبان دابا (محل واحد ولا «كل المحلات»)
let denied = false;
let unsubs = [];
let uid = null;
let tab = 'today';
let sel = (() => { try { return localStorage.getItem('site') || 'all'; } catch { return 'all'; } })();
let fromCopy = false; // الأرقام من النسخة المحفوظة فالتيليفون (فتح سريع، ولا بلا أنترنت)
let masked = (() => { try { return localStorage.getItem('mask') === '1'; } catch { return false; } })();
document.body.classList.toggle('masked', masked);

const updMs = (s) => toDate(s?.updatedAt)?.getTime() || 0;
/** لائحة المحلات (القديمة غير إلا ما كاين حتى محل جديد، ولا تحدّثات فـ 3 أيام اللخرين) */
function siteList() {
  const list = Object.entries(sites).map(([id, data]) => ({ id, data }));
  if (legacy && (!list.length || Date.now() - updMs(legacy) < 3 * 86400_000)) list.push({ id: '_old', data: legacy });
  return list.sort((a, b) => String(a.data.shop?.name || '').localeCompare(String(b.data.shop?.name || '')));
}
const sumKeys = (arr, k) => arr.reduce((a, x) => a + (Number(x?.[k]) || 0), 0);
/** «كل المحلات»: المجموع */
function aggregate(list) {
  const named = (s, arr) => (arr || []).map((x) => ({ ...x, user: `${x.user} · ${s.shop?.name || ''}` }));
  const todays = list.map((x) => x.data.today).filter(Boolean);
  const keys = ['total', 'salesCount', 'cash', 'card', 'credit', 'returnsTotal', 'expenses', 'profit'];
  const today = todays.length ? Object.fromEntries(keys.map((k) => [k, sumKeys(todays, k)])) : null;
  if (today) today.date = todays.map((t) => t.date).sort().pop();
  const debtsList = list.flatMap((x) => (x.data.debts?.list || []).map((c) => ({ ...c, name: list.length > 1 ? `${c.name} · ${x.data.shop?.name || ''}` : c.name })));
  return {
    _all: true,
    shop: { name: tr('allShops'), currency: list[0]?.data.shop?.currency || 'MAD' },
    today,
    registers: list.flatMap((x) => named(x.data, x.data.registers)),
    closed: list.flatMap((x) => named(x.data, x.data.closed)),
    cashInDrawers: sumKeys(list.map((x) => x.data), 'cashInDrawers'),
    debts: { total: sumKeys(list.map((x) => x.data.debts), 'total'), count: sumKeys(list.map((x) => x.data.debts), 'count'), list: debtsList.sort((a, b) => b.amount - a.amount) },
    // «كل المحلات» محدّثة غير إلا كاملين محدّثين: كناخدو الأقدم
    updatedAt: new Date(Math.min(...list.map((x) => updMs(x.data)).filter(Boolean))),
  };
}
function current() {
  const list = siteList();
  if (!list.length) return null;
  if (list.length === 1) return list[0].data;
  const one = list.find((x) => x.id === sel);
  return one ? one.data : aggregate(list);
}
function pick(id) {
  sel = id;
  try { localStorage.setItem('site', id); } catch {}
  repCache = null;
  render();
}

// نسخة صغيرة من آخر أرقام فالتيليفون: التطبيق كيتحلّ فالحين، حتى بلا أنترنت
const copyKey = (u) => 'shop:' + u;
function saveCopy() {
  if (!uid || (!legacy && !Object.keys(sites).length)) return;
  try {
    localStorage.setItem(copyKey(uid), JSON.stringify({ v: 2, sites, legacy }, (k, v) =>
      v && typeof v === 'object' && typeof v.seconds === 'number' && 'nanoseconds' in v ? new Date(v.seconds * 1000 + v.nanoseconds / 1e6).toISOString() : v));
  } catch {}
}
function loadCopy(u) {
  try {
    const c = JSON.parse(localStorage.getItem(copyKey(u)) || 'null');
    if (!c) return null;
    return c.v === 2 ? c : { sites: {}, legacy: c }; // النسخة القديمة ديال التطبيق
  } catch { return null; }
}

function renderSites() {
  const list = siteList();
  $('siteBar').classList.toggle('hidden', list.length < 2);
  const multi = list.length > 1;
  const isAll = multi && !list.some((x) => x.id === sel);
  if (multi) {
    $('siteBar').innerHTML = [`<button data-site="all" class="${isAll ? 'on' : ''}">${tr('allShops')}</button>`]
      .concat(list.map((x) => `<button data-site="${esc(x.id)}" class="${x.id === sel ? 'on' : ''}">${esc(x.data.shop?.name || x.id)}</button>`)).join('');
  }
  $('sitesCard').classList.toggle('hidden', !isAll);
  if (isAll) {
    $('sitesList').innerHTML = list.map((x) => {
      const s = x.data, at = toDate(s.updatedAt), stale = !at || Date.now() - at.getTime() > 75 * 60_000;
      currency = s.shop?.currency || 'MAD';
      return `<li class="site-row" data-site="${esc(x.id)}"><span class="dotc ${stale ? 'warn' : ''}"></span><div class="main"><div class="name">${esc(s.shop?.name || x.id)}</div>
        <div class="meta">${at ? ago(at) : ''}${stale ? ' · ' + tr('staleShort') : ''} · ${mh(s.cashInDrawers)} ${tr('drawer')}</div></div><div class="amt">${mh(s.today?.total)}</div></li>`;
    }).join('');
  }
}
$('siteBar').addEventListener('click', (e) => { const b = e.target.closest('[data-site]'); if (b) pick(b.dataset.site); });
$('sitesList').addEventListener('click', (e) => { const b = e.target.closest('[data-site]'); if (b) pick(b.dataset.site); });
document.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => {
  tab = b.dataset.tab;
  document.querySelectorAll('[data-tab]').forEach((x) => x.classList.toggle('on', x === b));
  render();
}));

function render() {
  if ($('app').classList.contains('hidden')) return;
  shop = current();
  renderSites();
  renderStatus();
  $('reportsBox').classList.toggle('hidden', tab !== 'reports');
  if (tab === 'reports') {
    $('noData').classList.add('hidden');
    $('todayBox').classList.add('hidden');
    $('shopName').textContent = shop?.shop?.name || tr('appName');
    return void renderReports();
  }
  const s = shop;
  $('shopName').textContent = s?.shop?.name || tr('appName');
  const today = s?.today;
  $('noData').classList.toggle('hidden', !!today);
  $('noData').textContent = denied ? tr('denied') : tr('noData');
  $('todayBox').classList.toggle('hidden', !today);
  $('foot').textContent = s?.version ? `${tr('version')}: v${s.version}` : '';
  if (!today) return;
  currency = s.shop?.currency || 'MAD';
  // النهار ديال الحاسوب هو المرجع (التيليفون يقدر يكون فساعة أخرى)
  $('kDate').textContent = today.date !== localDayKey() ? '· ' + dayLabel(today.date) : '';
  $('kTotal').textContent = money(today.total);
  $('kCount').innerHTML = `<bdi>${today.salesCount || 0}</bdi> ${tr('sales')}`;
  $('kDrawer').innerHTML = `${mh(s.cashInDrawers)} ${tr('drawer')}`;
  $('kCash').textContent = money(today.cash);
  $('kCard').textContent = money(today.card);
  $('kCredit').textContent = money(today.credit);
  $('kReturns').textContent = money(today.returnsTotal);
  $('kExpenses').textContent = money(today.expenses);
  $('kProfit').textContent = money(today.profit);
  $('kProfitBox').classList.toggle('neg', (today.profit || 0) < 0);

  const regs = s.registers || [];
  $('regs').innerHTML = regs.length
    ? regs.map((r) => `<div class="reg"><div class="top"><span>${esc(r.user)}</span><span class="badge">${tr('openedAt')} ${shortDate(r.openedAt)} ${timeOf(r.openedAt)}</span></div>
        <div class="meta">${tr('expected')}</div><div class="cash">${mh(r.expectedCash)}</div>
        <div class="meta"><span>${tr('opening')}: ${mh(r.opening)}</span><span><bdi>${r.salesCount || 0}</bdi> ${tr('sales')}: ${mh(r.sales)}</span><span>${tr('expenses')}: ${mh(r.expenses)}</span></div></div>`).join('')
    : `<div class="empty">${tr('noOpen')}</div>`;

  const closed = s.closed || [];
  $('closed').innerHTML = closed.length
    ? closed.map((r) => {
        const d = Number(r.difference) || 0;
        const tag = Math.abs(d) < 0.005 ? `<span class="badge ok">${tr('exact')}</span>` : `<span class="badge ${d < 0 ? 'bad' : ''}">${tr('diff')}: <bdi dir="ltr">${d > 0 ? '+' : ''}${money(d)}</bdi></span>`;
        return `<li><div class="main"><div class="name">${esc(r.user)} · ${tr('counted')} ${mh(r.closing)}</div>
          <div class="meta">${tr('openedAt')} ${timeOf(r.openedAt)} ← ${tr('closedAt')} ${timeOf(r.closedAt)} · ${tr('expected')}: ${mh(r.expected)}</div></div>${tag}</li>`;
      }).join('')
    : `<li class="empty">${tr('noClosed')}</li>`;

  const debts = s.debts || { total: 0, count: 0, list: [] };
  const late = (debts.list || []).filter((c) => c.overdue).length;
  $('debtTotal').innerHTML = debts.count ? `${late ? `<span class="badge bad" style="margin-inline-end:6px">${tr('lateCount', { n: late })}</span>` : ''}${mh(debts.total)}` : '';
  $('debtSearch').classList.toggle('hidden', (debts.list?.length || 0) < 6);
  const q = $('debtSearch').value.trim().toLowerCase();
  const shown = (debts.list || []).filter((c) => !q || String(c.name).toLowerCase().includes(q) || String(c.phone || '').replace(/\D/g, '').includes(q.replace(/\D/g, '') || '\u0000'));
  $('debts').innerHTML = !debts.list?.length
    ? `<li class="empty">${tr('noDebts')}</li>`
    : !shown.length
    ? `<li class="empty">${tr('noMatch')}</li>`
    : shown.map((c) => `<li><div class="main"><div class="name">${esc(c.name)} ${c.overdue ? `<span class="badge bad">${tr('late')}</span>` : ''}</div>
        <div class="meta">${c.phone ? `<a href="tel:${esc(c.phone)}" dir="ltr">${esc(c.phone)}</a>` : ''}</div></div><div class="amt">${mh(c.amount)}</div></li>`).join('');
  $('debtNote').textContent = debts.count > (debts.list?.length || 0) ? tr('moreDebts', { n: debts.count - debts.list.length }) : '';
}

function renderStatus() {
  const at = toDate(shop?.updatedAt);
  const box = $('status');
  $('copyNote').classList.toggle('hidden', !(fromCopy && navigator.onLine && shop));
  $('copyNote').textContent = tr('fromCopy');
  if (!at) { box.className = 'status warn'; $('statusText').textContent = denied ? tr('denied') : tr('never'); return; }
  if (!navigator.onLine) { box.className = 'status warn'; $('statusText').textContent = tr('phoneOffline', { t: ago(at) }); return; }
  // الحاسوب كيصيفط من بعد كل حركة (مرة فالدقيقة على الأكثر)، وعلى الأقل كل ساعة
  const stale = Date.now() - at.getTime() > 75 * 60_000;
  box.className = `status ${stale ? 'warn' : 'ok'}`;
  $('statusText').textContent = tr(stale ? 'stale' : 'online', { t: ago(at) });
}
setInterval(renderStatus, 30_000);
window.addEventListener('online', renderStatus);
window.addEventListener('offline', renderStatus);
$('debtSearch').addEventListener('input', render);

// ------------------------------------------------------------ زر «مزامنة»
// كيكتب طلب صغير (shops/{uid}/ctl/request)؛ الحاسوب كيشوفو كل دقيقتين ملي يكون صندوق مفتوح (كل 10 دقايق ملي يكونو مسدودين)
let waiting = null; // { before, timer }
function stopWaiting(msgKey) {
  if (!waiting) return;
  clearTimeout(waiting.timer);
  waiting = null;
  $('syncBtn').disabled = false;
  $('syncBtn').classList.remove('busy');
  $('syncMsg').textContent = msgKey ? tr(msgKey) : '';
}
$('syncBtn').addEventListener('click', async () => {
  if (!uid || waiting) return;
  const mins = (shop?.registers || []).length ? 3 : 11;
  $('syncBtn').disabled = true;
  $('syncBtn').classList.add('busy');
  $('syncMsg').textContent = tr('syncWait', { n: mins });
  waiting = { before: maxUpd(), timer: setTimeout(() => stopWaiting('syncNoAnswer'), mins * 60_000) };
  try {
    await setDoc(doc(db, 'shops', uid, 'ctl', 'request'), { at: serverTimestamp() });
  } catch (err) {
    stopWaiting();
    $('syncMsg').textContent = /network|unavailable/.test(String(err?.code)) ? tr('netErr') : String(err?.code || err);
  }
});

// ------------------------------------------------------------ القائمة
const openSheet = (id) => { $(id).classList.remove('hidden'); };
const closeSheet = (id) => { $(id).classList.add('hidden'); };
async function storageInfo() {
  try {
    const e = await navigator.storage?.estimate?.();
    if (e && typeof e.usage === 'number') return e.usage;
  } catch {}
  return null;
}
const kb = (b) => (b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB');
$('menuBtn').addEventListener('click', async () => {
  $('sheetMsg').textContent = '';
  $('maskSw').classList.toggle('on', masked);
  openSheet('sheet');
  const u = await storageInfo();
  $('storageVal').textContent = u != null ? kb(u) : '';
});
$('sheet').addEventListener('click', (e) => {
  if (e.target === $('sheet')) return closeSheet('sheet');
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'close') closeSheet('sheet');
  if (act === 'lang') switchLang();
  if (act === 'mask') {
    masked = !masked;
    try { localStorage.setItem('mask', masked ? '1' : '0'); } catch {}
    document.body.classList.toggle('masked', masked);
    $('maskSw').classList.toggle('on', masked);
  }
  if (act === 'share') shareSummary();
  if (act === 'clear') { closeSheet('sheet'); openSheet('confirm'); }
  if (act === 'logout') {
    try { localStorage.removeItem(copyKey(uid)); } catch {}
    closeSheet('sheet');
    signOut(auth);
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeSheet('sheet'); closeSheet('confirm'); } });
$('confirm').addEventListener('click', (e) => { if (e.target === $('confirm')) closeSheet('confirm'); });
$('confirmNo').addEventListener('click', () => closeSheet('confirm'));
$('confirmYes').addEventListener('click', clearArchive);

/** ملخص نصّي للواتساب */
function shareSummary() {
  const s = shop, d = s?.today;
  if (!d) return;
  currency = s.shop?.currency || 'MAD';
  const L = [`*${s.shop?.name || tr('appName')}* — ${tr('shareHead')} ${dayLabel(d.date)}`,
    `${tr('salesToday')}: ${money(d.total)} (${d.salesCount || 0} ${tr('sales')})`,
    `${tr('cash')}: ${money(d.cash)} · ${tr('card')}: ${money(d.card)} · ${tr('credit')}: ${money(d.credit)}`,
    `${tr('expenses')}: ${money(d.expenses)} · ${tr('returns')}: ${money(d.returnsTotal)} · ${tr('profit')}: ${money(d.profit)}`,
    `${tr('shareDrawer')}: ${money(s.cashInDrawers)}`];
  for (const r of s.closed || []) L.push(`${tr('shareClosed')} ${r.user} ${timeOf(r.closedAt)}: ${money(r.closing)} (${tr('diff')} ${money(r.difference)})`);
  if (s.debts?.count) L.push(`${tr('shareDebts')}: ${money(s.debts.total)} (${tr('debtCount', { n: s.debts.count })})`);
  const at = toDate(s.updatedAt);
  if (at) L.push(`${tr('shareUpdated')}: ${timeOf(at)}`);
  window.open('https://wa.me/?text=' + encodeURIComponent(L.join('\n')), '_blank');
}

/** مسح الأرشيف: الذاكرة ديال التطبيق + التاريخ القديم فالسحابة (الأرقام ديال اليوم كتبقى) */
async function clearArchive() {
  $('confirmYes').disabled = true;
  let days = 0, ok = true;
  // 1) التاريخ القديم فالسحابة (من النسخة 1.3.0): كتابة وحدة لكل يوم، مرة وحدة
  try {
    const qs = await getDocs(collection(db, 'shops', uid, 'days'));
    for (let i = 0; i < qs.docs.length; i += 400) {
      const b = writeBatch(db);
      qs.docs.slice(i, i + 400).forEach((x) => b.delete(x.ref));
      await b.commit();
    }
    days = qs.size;
  } catch { ok = false; }
  // 2) الذاكرة ديال التطبيق فالتيليفون (كنحتافظو غير باللغة وإخفاء الأرقام)
  try {
    // الدخول ديال Firebase (firebase:…) كيبقى: ما كتخرجش من الحساب
    for (const k of Object.keys(localStorage)) if (!/^firebase:/.test(k) && k !== 'lang' && k !== 'mask') localStorage.removeItem(k);
    sessionStorage.clear();
  } catch {}
  try { if (window.caches) for (const k of await caches.keys()) await caches.delete(k); } catch {}
  try { if (navigator.serviceWorker) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch {}
  saveCopy(); // النسخة ديال اليوم (صغيرة) باش يبقى الفتح سريع
  $('confirmYes').disabled = false;
  closeSheet('confirm');
  $('syncMsg').textContent = ok ? tr('cleared', { d: days ? tr('clearedDays', { n: days }) : '' }) : tr('clearFail');
}

// ------------------------------------------------------------ الدخول
setPersistence(auth, browserLocalPersistence).catch(() => {});
const loginMsg = (text, ok = false) => { $('loginMsg').textContent = text; $('loginMsg').className = `msg ${ok ? 'ok' : 'err'}`; };
const authErr = (e) => {
  const c = String(e?.code || '');
  if (/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c)) return tr('badLogin');
  if (/too-many-requests/.test(c)) return tr('tooMany');
  if (/network/.test(c)) return tr('netErr');
  return c || String(e);
};
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginBtn').disabled = true;
  loginMsg('');
  try {
    await signInWithEmailAndPassword(auth, $('email').value.trim(), $('password').value);
  } catch (err) {
    loginMsg(authErr(err));
  } finally {
    $('loginBtn').disabled = false;
  }
});
$('forgotBtn').addEventListener('click', async () => {
  const email = $('email').value.trim();
  if (!email) return loginMsg(tr('needEmail'));
  try {
    auth.languageCode = lang;
    await sendPasswordResetEmail(auth, email);
    loginMsg(tr('resetSent'), true);
  } catch (err) {
    // ما نقولوش واش الإيميل كاين ولا لا
    if (/network|too-many/.test(String(err?.code))) loginMsg(authErr(err)); else loginMsg(tr('resetSent'), true);
  }
});

const maxUpd = () => Math.max(0, updMs(legacy), ...Object.values(sites).map(updMs));
function afterChange(fromCacheNow) {
  fromCopy = fromCacheNow;
  saveCopy();
  if (waiting && maxUpd() > waiting.before) stopWaiting('syncDone');
  render();
}
onAuthStateChanged(auth, (user) => {
  unsubs.forEach((u) => u());
  unsubs = [];
  sites = {}; legacy = null; shop = null; denied = false; uid = user?.uid || null; repCache = null;
  stopWaiting();
  $('boot').classList.add('hidden');
  $('login').classList.toggle('hidden', !!user);
  $('app').classList.toggle('hidden', !user);
  if (!user) { applyLang(); return; }
  $('userEmail').textContent = user.email || '';
  $('password').value = '';
  const copy = loadCopy(user.uid);
  if (copy) { sites = copy.sites || {}; legacy = copy.legacy || null; fromCopy = true; }
  const onErr = (err) => { console.error(err); if (err?.code === 'permission-denied') denied = true; render(); };
  // المحلات: قراءة غير ملي كتتبدّل شي وثيقة (Firebase مجاني)
  unsubs.push(onSnapshot(collection(db, 'shops', user.uid, 'sites'), { includeMetadataChanges: true }, (qs) => {
    // بلا أنترنت: Firestore كيعطي غير اللي فالذاكرة ديالو (خاوي) — نخليو النسخة المحفوظة
    if (qs.metadata.fromCache && qs.empty && Object.keys(sites).length) return render();
    sites = Object.fromEntries(qs.docs.map((d) => [d.id, d.data()]));
    afterChange(qs.metadata.fromCache);
  }, onErr));
  unsubs.push(onSnapshot(doc(db, 'shops', user.uid), { includeMetadataChanges: true }, (snap) => {
    if (snap.metadata.fromCache && !snap.exists() && legacy) return render();
    legacy = snap.exists() ? snap.data() : null;
    afterChange(snap.metadata.fromCache);
  }, onErr));
  applyLang();
});

// ------------------------------------------------------------ التقارير
// كل محل: وثيقة لكل شهر (shops/{uid}/sites/{site}/months/YYYY-MM) فيها سطر لكل نهار {t,n,c,k,cr,r,e,p}
// الشهور اللي فاتو ما كيتبدّلوش: كيتحفظو فالتيليفون (قراءة وحدة فالعمر). الشهر الحالي واللي قبلو كيتقراو كل مرة.
let repCache = null; // { key, days: {date: row}, months: {YYYY-MM: row} }
let repLoading = false;
const monthKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
const addRow = (a, b) => { const o = { ...a }; for (const k of ['t', 'n', 'c', 'k', 'cr', 'r', 'e', 'p']) o[k] = (Number(o[k]) || 0) + (Number(b?.[k]) || 0); return o; };
async function loadMonth(site, m, fresh) {
  const key = `m:${uid}:${site}:${m}`;
  if (!fresh) { try { const c = localStorage.getItem(key); if (c) return JSON.parse(c); } catch {} }
  const snap = await getDoc(doc(db, 'shops', uid, 'sites', site, 'months', m));
  const days = snap.exists() ? snap.data().days || {} : {};
  if (!fresh) { try { localStorage.setItem(key, JSON.stringify(days)); } catch {} }
  return days;
}
async function loadReports() {
  const all = siteList();
  const list = all.filter((x) => x.id !== '_old'); // الوثيقة القديمة (1.3) ما فيهاش التاريخ
  const isAll = all.length > 1 && !all.some((x) => x.id === sel);
  const targets = all.length === 1 || isAll ? list : list.filter((x) => x.id === sel);
  const key = targets.map((x) => x.id).join(',');
  if (repCache?.key === key || repLoading) return;
  if (!targets.length) { repCache = { key, days: {}, months: {}, none: true }; return render(); }
  repLoading = true;
  render();
  const now = new Date();
  const months = Array.from({ length: 12 }, (_, i) => monthKey(new Date(now.getFullYear(), now.getMonth() - i, 1)));
  const days = {}, monthTotals = {};
  try {
    for (const t of targets) {
      for (const [i, m] of months.entries()) {
        const d = await loadMonth(t.id, m, i < 2); // الشهر الحالي واللي قبلو: ديما جداد
        let mt = monthTotals[m] || {};
        for (const [k, row] of Object.entries(d)) { days[k] = addRow(days[k] || {}, row); mt = addRow(mt, row); }
        monthTotals[m] = mt;
      }
    }
    repCache = { key, days, months: monthTotals };
  } catch (e) {
    console.error(e);
    repCache = { key, days, months: monthTotals, error: true };
  } finally {
    repLoading = false;
    render();
  }
}
const pct = (a, b) => (b ? Math.round(((a - b) / b) * 100) : null);
const cmpHtml = (v) => (v == null ? '—' : `<span class="cmp ${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '▲' : '▼'} ${Math.abs(v)}%</span>`);
function bars(values, labels, todayIdx) {
  const W = 320, H = 120, pad = 14, n = values.length, max = Math.max(1, ...values), bw = (W - 4) / n;
  const r = values.map((v, i) => {
    const h = Math.max(v > 0 ? 2 : 0, ((H - pad - 8) * v) / max);
    return `<rect class="bar ${i === todayIdx ? 'today' : ''}" x="${(2 + i * bw + bw * 0.12).toFixed(1)}" y="${(H - pad - h).toFixed(1)}" width="${(bw * 0.76).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5"><title>${esc(labels[i])}: ${money(v)}</title></rect>`;
  }).join('');
  const lab = labels.map((l, i) => (i % Math.ceil(n / 6) === 0 || i === n - 1 ? `<text x="${(2 + i * bw + bw / 2).toFixed(1)}" y="${H - 2}" text-anchor="middle">${esc(l)}</text>` : '')).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img"><line class="axis" x1="0" x2="${W}" y1="${H - pad}" y2="${H - pad}"/>${r}${lab}<text class="v" x="${W - 2}" y="9" text-anchor="end">${esc(money(max))}</text></svg>`;
}
function renderReports() {
  loadReports();
  const c = repCache;
  if (!c || repLoading) { $('yCard').innerHTML = `<div class="empty">${tr('loadingRep')}</div>`; $('chart30').innerHTML = ''; $('chart12').innerHTML = ''; $('stats30').innerHTML = ''; $('list12').innerHTML = ''; $('sum30').textContent = ''; $('repNote').textContent = ''; return; }
  currency = shop?.shop?.currency || 'MAD';
  // النهار ديال الحاسوب هو المرجع
  const base = shop?.today?.date ? new Date(shop.today.date + 'T12:00:00') : new Date();
  const key = (d) => localDayKey(d);
  const back = (n) => { const d = new Date(base); d.setDate(d.getDate() - n); return d; };
  const days = { ...c.days };
  if (shop?.today) days[shop.today.date] = { t: shop.today.total, n: shop.today.salesCount, c: shop.today.cash, k: shop.today.card, cr: shop.today.credit, r: shop.today.returnsTotal, e: shop.today.expenses, p: shop.today.profit }; // اليوم: من الأرقام المباشرة
  // تقرير البارح
  const yk = key(back(1)), y = days[yk];
  if (y && (y.n || y.t)) {
    const wk = days[key(back(8))];
    const avg7 = [2, 3, 4, 5, 6, 7, 8].map((i) => days[key(back(i))]?.t || 0).reduce((a, b) => a + b, 0) / 7;
    $('yCard').innerHTML = `<div class="yhead"><h2 style="margin:0">${tr('yReport')}</h2><small class="muted">${esc(dayLabel(yk))}</small></div>
      <div class="ybig">${mh(y.t)}</div>
      <div class="kv"><span>${tr('sales')}</span><span><bdi>${y.n || 0}</bdi></span><span>${tr('cash')} · ${tr('card')} · ${tr('credit')}</span><span>${money(y.c)} · ${money(y.k)} · ${money(y.cr)}</span>
      <span>${tr('expenses')}</span><span>${money(y.e)}</span><span>${tr('returns')}</span><span>${money(y.r)}</span><span>${tr('profit')}</span><span>${money(y.p)}</span>
      <span>${tr('vsWeek')}</span><span>${cmpHtml(wk ? pct(y.t, wk.t) : null)}</span><span>${tr('vsAvg')}</span><span>${cmpHtml(avg7 ? pct(y.t, avg7) : null)}</span></div>
      <button class="share-btn" id="shareY">📤 ${tr('shareReport')}</button>`;
    $('shareY').onclick = () => {
      const L = [`*${shop?.shop?.name || tr('appName')}* — ${tr('yReport')} ${dayLabel(yk)}`, `${tr('salesToday').split(' ')[0]}: ${money(y.t)} (${y.n || 0} ${tr('sales')})`,
        `${tr('cash')}: ${money(y.c)} · ${tr('card')}: ${money(y.k)} · ${tr('credit')}: ${money(y.cr)}`, `${tr('expenses')}: ${money(y.e)} · ${tr('returns')}: ${money(y.r)} · ${tr('profit')}: ${money(y.p)}`];
      if (wk) L.push(`${tr('vsWeek')}: ${pct(y.t, wk.t) >= 0 ? '+' : ''}${pct(y.t, wk.t)}%`);
      window.open('https://wa.me/?text=' + encodeURIComponent(L.join('\n')), '_blank');
    };
  } else $('yCard').innerHTML = `<h2>${tr('yReport')}</h2><div class="empty">${c.none ? tr('needUpdate') : tr('noYesterday')}</div>`;
  // 30 يوم
  const d30 = Array.from({ length: 30 }, (_, i) => back(29 - i));
  const v30 = d30.map((d) => days[key(d)]?.t || 0);
  const tot = v30.reduce((a, b) => a + b, 0), active = v30.filter((v) => v > 0).length;
  const bestI = v30.indexOf(Math.max(...v30));
  $('chart30').innerHTML = bars(v30, d30.map((d) => String(d.getDate())), 29);
  $('sum30').innerHTML = mh(tot);
  $('stats30').innerHTML = `<div><b>${money(tot)}</b><span>${tr('total30')}</span></div><div><b>${money(active ? tot / active : 0)}</b><span>${tr('avgDay')}</span></div>
    <div><b>${v30[bestI] ? money(v30[bestI]) : '—'}</b><span>${tr('bestDay')}${v30[bestI] ? ' · ' + esc(shortDate(d30[bestI])) : ''}</span></div>`;
  // 12 شهر
  const now = new Date(base);
  const m12 = Array.from({ length: 12 }, (_, i) => new Date(now.getFullYear(), now.getMonth() - 11 + i, 1));
  // الشهر الحالي: نبدّلو السطر ديال اليوم المحفوظ (قديم) بالأرقام المباشرة
  const neg = (row) => Object.fromEntries(Object.entries(row || {}).map(([k, v]) => [k, -(Number(v) || 0)]));
  const mt = (d) => {
    const m = monthKey(d);
    let r = c.months[m] || {};
    const td = shop?.today?.date;
    if (td?.startsWith(m)) r = addRow(addRow(r, neg(c.days[td])), days[td]);
    return r;
  };
  const v12 = m12.map((d) => mt(d).t || 0);
  const mName = (d, long) => d.toLocaleDateString(lang === 'ar' ? 'ar-MA' : 'fr-FR', long ? { month: 'long', year: 'numeric' } : { month: 'short' });
  $('chart12').innerHTML = bars(v12, m12.map((d) => mName(d)), 11);
  $('list12').innerHTML = m12.slice().reverse().filter((d) => mt(d).t).map((d) => { const r = mt(d); return `<li><div class="main"><div class="name">${esc(mName(d, true))}</div><div class="meta">${tr('profitShort')}: ${mh(r.p)} · <bdi>${r.n || 0}</bdi> ${tr('sales')}</div></div><div class="amt">${mh(r.t)}</div></li>`; }).join('');
  $('repNote').textContent = c.none ? tr('needUpdate') : !Object.keys(c.days).length ? tr('noHistory') : '';
}
applyLang();
</script>
